<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>ShipStation API Webhook Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
    <script src="fixtures.js"></script>
    <script src="replay.js"></script>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }
      h1 {
        font-size: 20px;
        margin-top: 0;
        color: #1a202c;
        border-bottom: 2px solid #edf2f7;
        padding-bottom: 15px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: #4a5568;
        margin-bottom: 5px;
        text-transform: uppercase;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #3182ce;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background: #2b6cb0;
      }
      button:disabled {
        background: #a0aec0;
        cursor: not-allowed;
      }
      .history {
        margin-top: 25px;
        border-top: 1px solid #edf2f7;
        padding-top: 15px;
      }
      .history-item {
        font-size: 12px;
        padding: 8px;
        border-bottom: 1px solid #f7fafc;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .history-item .meta {
        color: #718096;
        font-size: 11px;
        word-break: break-all;
      }
      .status-tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
      }
      .success {
        background: #c6f6d5;
        color: #22543d;
      }
      .error {
        background: #fed7d7;
        color: #822727;
      }
      .info-box {
        font-size: 11px;
        background: #ebf8ff;
        color: #2c5282;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        border: 1px solid #bee3f8;
      }
      .error-box {
        font-size: 12px;
        background: #fed7d7;
        color: #822727;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        border: 1px solid #feb2b2;
      }
      .hint {
        font-size: 11px;
        color: #718096;
        margin-top: 5px;
      }
      .hint.warn {
        color: #b7791f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 ShipStation API Webhook Simulator</h1>
      <div id="proxy-note" class="info-box"></div>
      <div id="load-error" class="error-box" style="display: none"></div>

      <div class="form-group">
        <label>Target Webhook URL</label>
        <input
          type="text"
          id="target_url"
          placeholder="https://webhook.site/..."
        />
      </div>

      <div class="form-group">
        <label>CORS Proxy (optional)</label>
        <input
          type="text"
          id="proxy_url"
          value="https://cors-anywhere.herokuapp.com/"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="hint">
          Put in front of your webhook URL. Clear it to send straight to the
          webhook URL.
        </div>
      </div>

      <div class="form-group">
        <label>Carrier</label>
        <select id="carrier"></select>
      </div>

      <div class="form-group">
        <label>Scenario</label>
        <select id="scenario"></select>
      </div>

      <div class="form-group">
        <label>Tracking Number</label>
        <input
          type="text"
          id="tracking_number"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div id="tracking_hint" class="hint"></div>
      </div>

      <button id="send-btn" onclick="fireWebhook()">Fire Webhook 🔥</button>
      <div class="hint">
        The x-shipengine-* signature headers are simulated placeholders, so a
        receiver that verifies ShipStation's RSA signature will reject these
        requests.
      </div>
      <div class="history"><div id="log-list"></div></div>
    </div>

    <script>
      // Payloads are real API_TRACK captures (fixtures.js) re-timed and given
      // your tracking number by the replay engine (replay.js).
      let log = [];
      let trackingEdited = false;

      const $ = (id) => document.getElementById(id);

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function labelFor(list, key, field) {
        const item = list.find((x) => (x.code || x.key) === key);
        return item ? item[field] : key;
      }

      function updateTrackingHint() {
        const code = $("carrier").value;
        const value = $("tracking_number").value.trim();
        const hint = $("tracking_hint");
        const warning = Replay.checkTrackingNumber(code, value);
        if (!value) {
          hint.textContent = "Leave blank to generate a number when you fire.";
        } else if (warning) {
          hint.textContent =
            "Not the usual format (" +
            warning +
            "). It will be sent as entered.";
        } else {
          hint.textContent = Replay.TRACKING_FORMATS[code].hint;
        }
        hint.className = "hint" + (warning && value ? " warn" : "");
      }

      function setDefaultTracking() {
        $("tracking_number").value = Replay.defaultTrackingNumber(
          $("carrier").value,
        );
        trackingEdited = false;
        updateTrackingHint();
      }

      // Proxy goes in front of the target URL. Add a "/" unless it already ends
      // in one, or in "?" / "=" (query-style proxies such as https://host/?url=).
      function withProxy(proxy, target) {
        if (!proxy) return target;
        return /[\/?=]$/.test(proxy) ? proxy + target : proxy + "/" + target;
      }

      function updateProxyNote() {
        const proxy = $("proxy_url").value.trim();
        const note = $("proxy-note");
        if (/cors-anywhere\.herokuapp\.com/i.test(proxy)) {
          note.innerHTML =
            '<strong>Required:</strong> Activate <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank">CORS Anywhere</a> first. The unlock is temporary and applies to this browser only.';
        } else if (!proxy) {
          note.textContent =
            "No proxy: the browser sends straight to your webhook URL, so that server must allow cross-origin (CORS) requests from this page.";
        } else {
          note.textContent =
            "Requests go through " +
            proxy +
            " (your webhook URL is added to the end). Make sure that proxy is running.";
        }
      }

      function describeError(err) {
        if (err.response) return "HTTP " + err.response.status;
        if (err.code === "ERR_NETWORK" || err.message === "Network Error") {
          return "Network error (proxy locked, CORS or unreachable)";
        }
        return err.message || "Unknown error";
      }

      function init() {
        if (!window.FIXTURES || !window.Replay) {
          const box = $("load-error");
          box.textContent =
            "fixtures.js or replay.js did not load, so payloads cannot be built. Check that both files are next to index.html.";
          box.style.display = "block";
          $("send-btn").disabled = true;
          return;
        }
        $("carrier").innerHTML = Replay.CARRIERS.map(
          (c) =>
            '<option value="' + esc(c.code) + '">' + esc(c.label) + "</option>",
        ).join("");
        $("scenario").innerHTML = Replay.SCENARIOS.map(
          (s) =>
            '<option value="' + esc(s.key) + '">' + esc(s.label) + "</option>",
        ).join("");
        $("scenario").value = "delivered";

        $("carrier").addEventListener("change", () => {
          if (trackingEdited) updateTrackingHint();
          else setDefaultTracking();
        });
        $("tracking_number").addEventListener("input", () => {
          trackingEdited = true;
          updateTrackingHint();
        });
        $("proxy_url").addEventListener("input", updateProxyNote);
        updateProxyNote();
        setDefaultTracking();
      }

      async function fireWebhook() {
        const btn = $("send-btn");
        const targetUrl = $("target_url").value.trim();
        const proxyUrl = $("proxy_url").value.trim();

        if (!targetUrl) return alert("URL required.");
        if (proxyUrl && !/^https?:\/\//i.test(proxyUrl)) {
          return alert(
            "The proxy must start with http:// or https:// (or be left blank).",
          );
        }
        const finalUrl = withProxy(proxyUrl, targetUrl);

        const config = {
          carrier: $("carrier").value,
          scenario: $("scenario").value,
          tracking: $("tracking_number").value.trim(),
        };

        let payload;
        try {
          payload = Replay.build({
            carrier: config.carrier,
            scenario: config.scenario,
            trackingNumber: config.tracking,
          });
        } catch (err) {
          console.error(err);
          return alert("Could not build the payload: " + err.message);
        }

        // Show the number that was actually sent (it is generated if left blank).
        $("tracking_number").value = payload.data.tracking_number;
        if (!config.tracking) trackingEdited = false;
        updateTrackingHint();

        btn.disabled = true;
        const entry = { ...config, tracking: payload.data.tracking_number };

        try {
          // The three x-shipengine-* signature headers are simulated placeholders.
          const res = await axios.post(finalUrl, payload, {
            headers: {
              "X-Requested-With": "XMLHttpRequest",
              "x-shipengine-timestamp": Math.floor(
                Date.now() / 1000,
              ).toString(),
              "x-shipengine-rsa-sha256-signature":
                "SIMULATED_SIGNATURE_BASE64_STRING",
              "x-shipengine-rsa-sha256-key-id": "key_sim_123456789",
            },
          });
          addLog({ ...entry, reason: "HTTP " + res.status }, true);
        } catch (err) {
          console.error(err);
          addLog({ ...entry, reason: describeError(err) }, false);
        } finally {
          btn.disabled = false;
        }
      }

      function addLog(c, success) {
        log.unshift({ time: new Date().toLocaleTimeString(), ...c, success });
        $("log-list").innerHTML = log
          .map(
            (l) => `
            <div class="history-item">
                <span>
                    <strong>${esc(l.time)}</strong> ${esc(labelFor(Replay.CARRIERS, l.carrier, "label"))} · ${esc(labelFor(Replay.SCENARIOS, l.scenario, "label"))}
                    <div class="meta">${esc(l.tracking)} · ${esc(l.reason)}</div>
                </span>
                <span class="status-tag ${l.success ? "success" : "error"}">${l.success ? "SENT" : "ERR"}</span>
            </div>
        `,
          )
          .join("");
      }

      init();

      // Register the Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker registered!", reg))
            .catch((err) =>
              console.log("Service Worker registration failed:", err),
            );
        });
      }
    </script>
  </body>
</html>
````
